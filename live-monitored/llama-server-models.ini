version = 1

; This is the only live model catalog. Docker mounts it read-only at
; /etc/mx-llama/models.ini. Keep KV caches at their native default precision:
; scripts/check-model-presets rejects every cache-type override.

[*]
jinja = true
log-prefix = true
log-timestamps = true
log-verbosity = 2

; Qwen3.8 27B Q8_0, MTP depth 2. Three slots share the largest
; 3-way/256-token-aligned context pool below the native 262144-token limit.
[REC-qwen3.8-27b-q8_0-mtp2]
model = /home/llama/.cache/huggingface/hub/models--unsloth--Qwen3.8-27B-GGUF/snapshots/fe1e2a23d973adb629709749dc4f6756df66ef10/Qwen3.8-27B-Q8_0.gguf
gpu-layers = 99
flash-attn = on
split-mode = tensor
device = ROCm0,ROCm1
load-mode = dio
batch-size = 2048
ubatch-size = 2048
ctx-size = 261888
parallel = 3
spec-type = draft-mtp
spec-draft-n-max = 2
reasoning = on
chat-template-kwargs = {"reasoning_effort":"medium","preserve_thinking":true}
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0
log-prefix = true
log-timestamps = true
log-verbosity = 2

; Gemma 4 31B-it UD-Q5_K_XL, native 256K context, three slots, MTP depth 2.
; Both files are pinned because moving Hub revisions otherwise trigger surprise
; multi-gigabyte refreshes. See live-monitored/README.md for the update process.
[REC-gemma-4-31b-it-ud-q5_k_xl-mtp2]
model = /home/llama/.cache/huggingface/hub/models--unsloth--gemma-4-31B-it-GGUF/snapshots/6a969627f3372486b68c2bf2ed87fdfd972cc8d0/gemma-4-31B-it-UD-Q5_K_XL.gguf
model-draft = /home/llama/.cache/huggingface/hub/models--unsloth--gemma-4-31B-it-GGUF/snapshots/8906b3db2e669a0b1d6293c315d3f9fbf934a86d/MTP/gemma-4-31B-it-Q8_0-MTP.gguf
ctx-size = 256000
fit = on
fit-target = 2072
parallel = 3
threads = 8
spec-type = draft-mtp
spec-draft-n-max = 2
reasoning = on
temp = 1.0
top-p = 0.95
top-k = 64
log-prefix = true
log-timestamps = true
log-verbosity = 2

; gpt-oss 120B MXFP4, 2x50K; tuned to fit VRAM with dual parallel queries. Frontier
[REC-gpt-oss-120b-mxfp4-2x50k]
hf-repo = ggml-org/gpt-oss-120b-GGUF
gpu-layers = 99
flash-attn = on
ctx-size = 100000
main-gpu = 0
fit-target = 500
no-mmap = true
tensor-split = 16,17
parallel = 2
log-prefix = true
log-timestamps = true
log-verbosity = 2

; gpt-oss 20B MXFP4, 3x150K; tuned long-context profile with flash-attn/no-mmap.
[gpt-oss-20b-mxfp4-3x150k-tuned]
hf-repo = ggml-org/gpt-oss-20b-GGUF
ctx-size = 150000
fit = on
fit-target = 500
parallel = 3
flash-attn = on
main-gpu = 0
no-mmap = true
log-prefix = true
log-timestamps = true
log-verbosity = 2
