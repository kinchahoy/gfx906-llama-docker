version = 1

; This is the only live model catalog. Docker mounts it read-only at
; /etc/mx-llama/models.ini. Models must use hf-repo so llama.cpp owns Hub
; downloads and MTP mapping. Keep KV caches at their native default precision:
; do not add cache-type overrides without explicit operator approval.

[*]
jinja = true
log-prefix = true
log-timestamps = true
log-verbosity = 2

; Qwen3.8 27B Q8_0, MTP depth 2. The canonical cached model is the default
; medium-thinking profile. Three slots dynamically share a 368640-token unified
; KV pool; any one slot may grow to the model's native 262144-token limit while
; the other slots use the remaining pool. Ubatch 1024 preserves useful GPU0
; headroom; logical batch remains at the tuned 2048 value.
[unsloth/Qwen3.8-27B-GGUF:Q8_0]
alias = qwen3.8-27b-q8_0-mtp2,qwen3.8-27b-q8_0-mtp2-medium
hf-repo = unsloth/Qwen3.8-27B-GGUF:Q8_0
gpu-layers = 99
flash-attn = on
split-mode = tensor
device = ROCm0,ROCm1
load-mode = dio
batch-size = 2048
ubatch-size = 1024
ctx-size = 368640
parallel = 3
kv-unified = true
spec-type = draft-mtp
spec-draft-n-max = 2
reasoning = on
reasoning-preserve = true
chat-template-kwargs = {"reasoning_effort":"medium"}
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0
log-prefix = true
log-timestamps = true
log-verbosity = 2

; Same Qwen weights and execution settings, with the template's most thorough
; reasoning mode. Selecting this ID reloads the worker if another profile is
; active; a request-level chat_template_kwargs override avoids that reload.
[qwen3.8-27b-q8_0-mtp2-xhigh]
hf-repo = unsloth/Qwen3.8-27B-GGUF:Q8_0
gpu-layers = 99
flash-attn = on
split-mode = tensor
device = ROCm0,ROCm1
load-mode = dio
batch-size = 2048
ubatch-size = 1024
ctx-size = 368640
parallel = 3
kv-unified = true
spec-type = draft-mtp
spec-draft-n-max = 2
reasoning = on
reasoning-preserve = true
chat-template-kwargs = {"reasoning_effort":"xhigh"}
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0
log-prefix = true
log-timestamps = true
log-verbosity = 2

; Same Qwen weights and execution settings with thinking disabled.
[qwen3.8-27b-q8_0-mtp2-no-reasoning]
hf-repo = unsloth/Qwen3.8-27B-GGUF:Q8_0
gpu-layers = 99
flash-attn = on
split-mode = tensor
device = ROCm0,ROCm1
load-mode = dio
batch-size = 2048
ubatch-size = 1024
ctx-size = 368640
parallel = 3
kv-unified = true
spec-type = draft-mtp
spec-draft-n-max = 2
reasoning = off
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0
log-prefix = true
log-timestamps = true
log-verbosity = 2

; Gemma 4 31B-it Q8_0. Match Qwen's tensor-parallel execution envelope with a
; measured 235008-token unified pool. Ubatch 1024 keeps target, HF-mapped MTP,
; mmproj, and native KV resident on the GPUs with at least a half-GiB buffer.
[unsloth/gemma-4-31B-it-GGUF:Q8_0]
alias = gemma-4-31b-it-q8_0-mtp2
hf-repo = unsloth/gemma-4-31B-it-GGUF:Q8_0
gpu-layers = 99
flash-attn = on
split-mode = tensor
device = ROCm0,ROCm1
load-mode = dio
batch-size = 2048
ubatch-size = 1024
ctx-size = 235008
parallel = 3
kv-unified = true
spec-type = draft-mtp
spec-draft-n-max = 2
reasoning = on
reasoning-preserve = true
temp = 1.0
top-p = 0.95
top-k = 64
log-prefix = true
log-timestamps = true
log-verbosity = 2

; gpt-oss 120B MXFP4, 2x50K; tuned to fit VRAM with dual parallel queries. Frontier
[ggml-org/gpt-oss-120b-GGUF:MXFP4]
alias = gpt-oss-120b-mxfp4-2x50k
hf-repo = ggml-org/gpt-oss-120b-GGUF:MXFP4
gpu-layers = 99
flash-attn = on
ctx-size = 100000
main-gpu = 0
fit-target = 500
no-mmap = true
tensor-split = 16,17
parallel = 2
log-prefix = true
log-timestamps = true
log-verbosity = 2

; gpt-oss 20B MXFP4, 3x150K; tuned long-context profile with flash-attn/no-mmap.
[ggml-org/gpt-oss-20b-GGUF:MXFP4]
alias = gpt-oss-20b-mxfp4-3x150k-tuned
hf-repo = ggml-org/gpt-oss-20b-GGUF:MXFP4
ctx-size = 150000
fit = on
fit-target = 500
parallel = 3
flash-attn = on
main-gpu = 0
no-mmap = true
log-prefix = true
log-timestamps = true
log-verbosity = 2
