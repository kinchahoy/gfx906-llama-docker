version = 1

; This is the only live model catalog. Docker mounts it read-only at
; /etc/mx-llama/models.ini. Models must use hf-repo so llama.cpp owns Hub
; downloads and MTP mapping. Keep KV caches at their native default precision:
; do not add cache-type overrides without explicit operator approval.

[*]
jinja = true
log-prefix = true
log-timestamps = true
log-verbosity = 2

; Qwen3.8 27B Q8_0, MTP depth 2. Three slots share the largest
; 3-way/256-token-aligned context pool below the native 262144-token limit.
[REC-qwen3.8-27b-q8_0-mtp2]
hf-repo = unsloth/Qwen3.8-27B-GGUF:Q8_0
gpu-layers = 99
flash-attn = on
split-mode = tensor
device = ROCm0,ROCm1
load-mode = dio
batch-size = 2048
ubatch-size = 2048
ctx-size = 261888
parallel = 3
spec-type = draft-mtp
spec-draft-n-max = 2
reasoning = on
chat-template-kwargs = {"reasoning_effort":"medium","preserve_thinking":true}
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0
log-prefix = true
log-timestamps = true
log-verbosity = 2

; Gemma 4 31B-it Q8_0. Match the Qwen tensor-parallel execution envelope and
; let llama.cpp map mtp-gemma-4-31B-it.gguf from the same Hub repository.
[REC-gemma-4-31b-it-q8_0-mtp2]
hf-repo = unsloth/gemma-4-31B-it-GGUF:Q8_0
gpu-layers = 99
flash-attn = on
split-mode = tensor
device = ROCm0,ROCm1
load-mode = dio
batch-size = 2048
ubatch-size = 2048
ctx-size = 261888
parallel = 3
spec-type = draft-mtp
spec-draft-n-max = 2
reasoning = on
temp = 1.0
top-p = 0.95
top-k = 64
log-prefix = true
log-timestamps = true
log-verbosity = 2

; gpt-oss 120B MXFP4, 2x50K; tuned to fit VRAM with dual parallel queries. Frontier
[REC-gpt-oss-120b-mxfp4-2x50k]
hf-repo = ggml-org/gpt-oss-120b-GGUF
gpu-layers = 99
flash-attn = on
ctx-size = 100000
main-gpu = 0
fit-target = 500
no-mmap = true
tensor-split = 16,17
parallel = 2
log-prefix = true
log-timestamps = true
log-verbosity = 2

; gpt-oss 20B MXFP4, 3x150K; tuned long-context profile with flash-attn/no-mmap.
[gpt-oss-20b-mxfp4-3x150k-tuned]
hf-repo = ggml-org/gpt-oss-20b-GGUF
ctx-size = 150000
fit = on
fit-target = 500
parallel = 3
flash-attn = on
main-gpu = 0
no-mmap = true
log-prefix = true
log-timestamps = true
log-verbosity = 2
