; Two-MI60 Qwen3.8 Q8_0 profile based on ~/infer/QWEN38_GFX906_QUICKSTART.md,
; expanded to three parallel request slots sharing a native 256K context pool.
; The matching container environment enables internal all-reduce and the private
; gfx906 PP2048 overlap path with BF16 transport.
[REC-qwen3.8-27b-q8_0-mtp2]
model = /home/llama/.cache/huggingface/hub/models--unsloth--Qwen3.8-27B-GGUF/snapshots/fe1e2a23d973adb629709749dc4f6756df66ef10/Qwen3.8-27B-Q8_0.gguf
gpu-layers = 99
flash-attn = on
split-mode = tensor
device = ROCm0,ROCm1
load-mode = dio
batch-size = 2048
ubatch-size = 2048
; 261888 is the largest 3-way/256-token-aligned allocation below 262144.
ctx-size = 261888
parallel = 3
spec-type = draft-mtp
spec-draft-n-max = 2
reasoning = on
chat-template-kwargs = {"reasoning_effort":"medium","preserve_thinking":true}
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0
log-prefix = true
log-timestamps = true
log-verbosity = 2

