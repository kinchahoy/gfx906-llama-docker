version = 1

; Generated from llama-swap-config.yml.
; Section names match the llama-swap model aliases, except recommended presets
; now use the REC- prefix.

[*]
jinja = true
log-prefix = true
log-timestamps = true
log-verbosity = 2

; gpt-oss 120B MXFP4, 2x50K; tuned to fit VRAM with dual parallel queries. Frontier
[REC-gpt-oss-120b-mxfp4-2x50k]
hf-repo = ggml-org/gpt-oss-120b-GGUF
gpu-layers = 99
flash-attn = on
ctx-size = 100000
main-gpu = 0
fit-target = 500
no-mmap = true
tensor-split = 16,17
parallel = 2
log-prefix = true
log-timestamps = true
log-verbosity = 2

; gpt-oss 20B MXFP4, 3x150K; tuned long-context profile with flash-attn/no-mmap.
[gpt-oss-20b-mxfp4-3x150k-tuned]
hf-repo = ggml-org/gpt-oss-20b-GGUF
ctx-size = 150000
fit = on
fit-target = 500
parallel = 3
flash-attn = on
main-gpu = 0
no-mmap = true
log-prefix = true
log-timestamps = true
log-verbosity = 2

; gemma-3 27B-it Q8_0, 4x32K; quality-first default profile with fit-based VRAM control.
[gemma-3-27b-it-q8_0-4x32k]
