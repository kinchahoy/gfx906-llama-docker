models:
  # Naming note: `2x50K`/`1x32K` encodes slot count x per-slot context. This is request concurrency (`-np`), not GPU count.
  # gpt-oss 120B MXFP4, 2x50K; tuned to fit VRAM with dual parallel queries. Frontier
  REC-gpt-oss-120b-mxfp4-2x50k:
    cmd: /home/llama/bin/llama-server --port ${PORT} -hf ggml-org/gpt-oss-120b-GGUF -ngl 99 -fa 1 -c 100000 --main-gpu 0 -fitt 500 --no-mmap -ts 16,17 --jinja -np 2 --log-prefix --log-timestamps -lv 2

  # gpt-oss 20B MXFP4, 3x150K; tuned long-context profile with flash-attn/no-mmap.
  gpt-oss-20b-mxfp4-3x150k-tuned:
    cmd: /home/llama/bin/llama-server --port ${PORT} -hf ggml-org/gpt-oss-20b-GGUF --jinja -c 150000 --fit on --fit-target 500 -np 3 -fa 1 --main-gpu 0 --no-mmap --log-prefix --log-timestamps -lv 2

  # gemma-3 27B-it Q8_0, 4x32K; quality-first default profile with fit-based VRAM control.
  gemma-3-27b-it-q8_0-4x32k:
